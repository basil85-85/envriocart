<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
    <!-- Gradient Definition -->
    <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#BF953F" />
            <stop offset="100%" style="stop-color:#FCF6BA" />
        </linearGradient>
        <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#064e3b" />
            <stop offset="100%" style="stop-color:#065f46" />
        </linearGradient>
    </defs>

    <!-- Background Circle - Enlarged -->
    <circle cx="75" cy="50" r="40" fill="url(#emeraldGradient)"/>
    
    <!-- Elegant Gold Frame - Enlarged -->
    <path d="M75 5c-24.9 0-45 20.1-45 45s20.1 45 45 45 45-20.1 45-45S99.9 5 75 5zm0 84c-21.6 0-39-17.4-39-39s17.4-39 39-39 39 17.4 39 39-17.4 39-39 39z"
          fill="url(#goldGradient)"/>
    
    <!-- Centered Cart Design - Scaled up -->
    <g transform="translate(52, 40) scale(1.2)">
        <!-- Cart Body -->
        <path d="M0 8h15.5c.8 0 1.5-.5 1.8-1.2l2.5-4c.3-.6.3-1.3 0-1.9s-.9-1-1.6-1H-1.6L-2.3 0C-2.5-.8-3.2-1-4-1H-6v2h2l4.6 6.7c.2.7.9 1.3 1.7 1.3z"
              fill="#064e3b"/>
        
        <!-- Cart Wheels -->
        <circle cx="4" cy="12" r="2" fill="url(#goldGradient)"/>
        <circle cx="14" cy="12" r="2" fill="url(#goldGradient)"/>
    </g>
    
    <!-- Luxury Leaf - Enlarged -->
    <path d="M75 25c0-3 2.25-5.25 5.25-5.25-3 0-5.25-2.25-5.25-5.25 0 3-2.25 5.25-5.25 5.25 3 0 5.25 2.25 5.25 5.25z"
          fill="#10b981"/>
    
    <!-- Brand Name - Larger text -->
    <text x="140" y="60" 
          font-family="'Playfair Display', serif" 
          font-size="32" 
          font-weight="600" 
          fill="url(#goldGradient)" 
          text-anchor="middle"
          style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3))">
        ENVRIO
    </text>
    
    <!-- Decorative Lines Under Text -->
    <line x1="100" y1="65" x2="180" y2="65" 
          stroke="url(#goldGradient)" 
          stroke-width="1.5"/>
    
    <!-- Additional Ornate Details -->
    <path d="M95 65c7.5-3 15-3 22.5 0" stroke="url(#goldGradient)" stroke-width="0.75" fill="none"/>
    <path d="M162.5 65c7.5-3 15-3 22.5 0" stroke="url(#goldGradient)" stroke-width="0.75" fill="none"/>
    
    <!-- Luxury Corner Accents -->
    <circle cx="75" cy="50" r="1.5" fill="url(#goldGradient)"/>
    <circle cx="71" cy="50" r="0.75" fill="url(#goldGradient)"/>
    <circle cx="79" cy="50" r="0.75" fill="url(#goldGradient)"/>
    
    <!-- Diamond-like Accents -->
    <path d="M75 48l6-6M75 48l-6-6" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
    <path d="M75 52l6 6M75 52l-6 6" stroke="url(#goldGradient)" stroke-width="1" fill="none"/>
</svg>